services:
  postgres:
    image: postgres:16.2
    container_name: aegis-postgres
    environment:
      POSTGRES_DB: aegis_db
      POSTGRES_USER: aegis_user
      POSTGRES_PASSWORD: aegis_password
    ports:
      - "5432:5432"
    volumes:
      - aegis-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis_user -d aegis_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: aegis-redis
    ports:
      - "6379:6379"
    volumes:
      - aegis-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: confluentinc/confluent-local:7.6.0
    container_name: aegis-kafka
    ports:
      - "9092:9092"
    volumes:
      - aegis-kafka-data:/var/lib/kafka/data

volumes:
  aegis-postgres-data:
  aegis-redis-data:
  aegis-kafka-data: